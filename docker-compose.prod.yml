services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_agent_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - batix_agent_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: batix_agent_nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.batix_agent.rule=Host(`${BATIX_AGENT_HOST}`)
      - traefik.http.routers.batix_agent.entrypoints=websecure
      - traefik.http.routers.batix_agent.tls=true
      - traefik.http.routers.batix_agent.tls.certresolver=le
      - traefik.http.services.batix_agent.loadbalancer.server.port=80
    networks:
      - web
      - agent_internal

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_agent_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: sh -lc "php artisan queue:work redis --sleep=2 --tries=3 --timeout=120"
    volumes:
      - batix_agent_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_internal

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_agent_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - batix_agent_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent_internal

  postgres:
    image: postgres:17-alpine
    container_name: batix_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - batix_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent_internal

  redis:
    image: redis:8-alpine
    container_name: batix_agent_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - batix_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agent_internal

volumes:
  batix_agent_storage:
  batix_agent_pgdata:
  batix_agent_redis:

networks:
  web:
    external: true
    name: web
  agent_internal:
    driver: bridge
